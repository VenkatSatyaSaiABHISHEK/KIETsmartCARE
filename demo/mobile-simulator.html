<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIET Smart Care • Live Digital Mobile Simulator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 40px;
      overflow-x: hidden;
    }

    /* Top Control Banner */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 900px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px 20px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .brand-sub {
      font-size: 11px;
      color: #94a3b8;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn-pill:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .btn-pill.primary {
      background: #0284c7;
      border-color: #38bdf8;
    }

    .btn-pill.primary:hover {
      background: #0369a1;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 4px;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      display: inline-block;
    }

    /* Smartphone Workspace */
    .simulator-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px 0;
    }

    /* Smartphone Physical Chassis */
    .smartphone-chassis {
      position: relative;
      width: 390px;
      height: 812px;
      background: #0b0f19;
      border-radius: 54px;
      padding: 12px;
      box-shadow:
        0 0 0 4px #2a3447,
        0 0 0 8px #131a29,
        0 25px 60px rgba(0, 0, 0, 0.7),
        0 40px 100px rgba(2, 132, 199, 0.15);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Screen Inner Bezels */
    .smartphone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      background: #fafafa;
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island / Notch */
    .screen-punch-hole {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 105px;
      height: 28px;
      background: #000;
      border-radius: 16px;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      pointer-events: none;
    }

    .camera-lens {
      width: 10px;
      height: 10px;
      border-radius: 5px;
      background: #0c1829;
      border: 1px solid #1e293b;
    }

    .sensor-dot {
      width: 6px;
      height: 6px;
      border-radius: 3px;
      background: #042f2e;
    }

    /* Live App Iframe */
    .app-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      flex: 1;
    }

    /* Home Indicator Line */
    .home-indicator-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 4px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 2px;
      z-index: 50;
      pointer-events: none;
    }

    /* Physical Side Buttons */
    .side-btn {
      position: absolute;
      background: #2a3447;
      border-radius: 3px;
    }

    .volume-up {
      left: -11px;
      top: 130px;
      width: 4px;
      height: 46px;
    }

    .volume-down {
      left: -11px;
      top: 190px;
      width: 4px;
      height: 46px;
    }

    .power-btn {
      right: -11px;
      top: 155px;
      width: 4px;
      height: 64px;
    }

    /* Footer hints */
    .footer-hints {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      max-width: 500px;
      line-height: 1.6;
    }

    .footer-hints strong {
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- Top Controls Dock -->
  <header class="top-bar">
    <div class="brand">
      <div class="brand-icon">📱</div>
      <div>
        <div class="brand-title">Digital Mobile Simulator</div>
        <div class="brand-sub">KIET Smart Care Student App &bull; Live Embedded Instance</div>
      </div>
    </div>

    <div class="controls">
      <span style="font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 6px;">
        <span class="status-dot"></span> Port 8081 Live
      </span>
      <button class="btn-pill" onclick="reloadPhone()" title="Reload Mobile App">
        🔄 Reload
      </button>
      <button class="btn-pill" onclick="changeDevice('iphone')" id="btnIphone">
        🍎 iPhone
      </button>
      <button class="btn-pill" onclick="changeDevice('pixel')" id="btnPixel">
        🤖 Pixel
      </button>
      <a class="btn-pill primary" href="http://localhost:8081" target="_blank" title="Open full screen in new tab">
        ↗ Full Screen
      </a>
    </div>
  </header>

  <!-- Interactive Digital Mobile Chassis -->
  <div class="simulator-stage">
    <div class="smartphone-chassis" id="phoneChassis">
      <!-- Hardware physical buttons -->
      <div class="side-btn volume-up"></div>
      <div class="side-btn volume-down"></div>
      <div class="side-btn power-btn"></div>

      <!-- Inner Touchscreen -->
      <div class="smartphone-screen">
        <!-- Punch-hole notch -->
        <div class="screen-punch-hole" id="screenNotch">
          <div class="camera-lens"></div>
          <div class="sensor-dot"></div>
        </div>

        <!-- Embedded Live App running on Expo Web -->
        <iframe
          id="appFrame"
          class="app-iframe"
          src="http://localhost:8081"
          allow="autoplay; camera; microphone; geolocation"
        ></iframe>

        <!-- Bottom Gesture Home Indicator -->
        <div class="home-indicator-bar"></div>
      </div>
    </div>
  </div>

  <div class="footer-hints">
    <strong>Interactive Laptop Mobile Viewer</strong>: Click and scroll inside the digital phone exactly as on a physical smartphone. Supports audio chimes, tabs, profile popups, and meal reminders.
  </div>

  <script>
    const appFrame = document.getElementById('appFrame');
    const phoneChassis = document.getElementById('phoneChassis');
    const screenNotch = document.getElementById('screenNotch');

    function reloadPhone() {
      appFrame.src = 'http://localhost:8081?t=' + Date.now();
    }

    function changeDevice(type) {
      if (type === 'pixel') {
        phoneChassis.style.width = '392px';
        phoneChassis.style.height = '820px';
        phoneChassis.style.borderRadius = '42px';
        phoneChassis.style.boxShadow = '0 0 0 4px #334155, 0 0 0 8px #1e293b, 0 30px 80px rgba(0,0,0,0.8)';
        screenNotch.style.width = '24px';
        screenNotch.style.height = '24px';
        screenNotch.style.borderRadius = '12px';
      } else {
        phoneChassis.style.width = '390px';
        phoneChassis.style.height = '812px';
        phoneChassis.style.borderRadius = '54px';
        phoneChassis.style.boxShadow = '0 0 0 4px #2a3447, 0 0 0 8px #131a29, 0 25px 60px rgba(0,0,0,0.7)';
        screenNotch.style.width = '105px';
        screenNotch.style.height = '28px';
        screenNotch.style.borderRadius = '16px';
      }
    }
  </script>
</body>
</html>
